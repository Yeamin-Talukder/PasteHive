# The website in website/, served by GitHub Pages.
#
# A pull request that touches it is type-checked, linted and built. A push to
# main does the same and then publishes the result. It can also be published
# by hand: Actions > Website > Run workflow.
#
# In the repository's settings, Pages must have "GitHub Actions" as its
# source. The address and sub-path are read from those settings, so nothing
# here changes if a custom domain is added later.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Work out the site's address
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A pull request only checks that the site builds, and may come
            # from a fork that cannot read the Pages settings. Assume the
            # usual project address.
            repo="${GITHUB_REPOSITORY#*/}"
            echo "NEXT_PUBLIC_BASE_PATH=/$repo" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=https://${GITHUB_REPOSITORY_OWNER,,}.github.io/$repo" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_BASE_PATH=$PAGES_BASE_PATH" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_SITE_URL=$PAGES_BASE_URL" >> "$GITHUB_ENV"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/out

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
