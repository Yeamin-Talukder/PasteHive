<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <title>PasteHive banner: clipboard history and sync for Windows, macOS and Android</title>
  <!-- Source of docs/banner.png. Open this file in a browser to render it:
       the app icon is loaded, unchanged, from concept-3-icon.svg beside it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.55" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <radialGradient id="lift" gradientUnits="userSpaceOnUse" cx="300" cy="320" r="420">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="icon-shadow" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse" x="0" y="0" width="640" height="640">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- a lighter backdrop than the icon, so the icon's own shape stands out -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#lift)"/>

  <!-- the app icon, exactly as shipped, with a shadow and a bright rim -->
  <rect x="120" y="164" width="360" height="360" rx="80" fill="#000" opacity="0.65" filter="url(#icon-shadow)"/>
  <image href="concept-3-icon.svg" x="120" y="140" width="360" height="360"/>
  <rect x="121" y="141" width="358" height="358" rx="79.5" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="2"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" fill="#fff">
    <text x="566" y="292" font-size="108" font-weight="700" letter-spacing="-2">PasteHive</text>
    <text x="570" y="352" font-size="31" fill="#d2d2d2">Clipboard history and sync for</text>
    <text x="570" y="394" font-size="31" fill="#d2d2d2">Windows, macOS and Android</text>

    <g font-size="20" font-weight="600" fill="#ededed">
      <rect x="570" y="442" width="178" height="44" rx="22" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.26"/>
      <text x="659" y="471" text-anchor="middle">Local network</text>
      <rect x="762" y="442" width="130" height="44" rx="22" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.26"/>
      <text x="827" y="471" text-anchor="middle">Encrypted</text>
      <rect x="906" y="442" width="140" height="44" rx="22" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.26"/>
      <text x="976" y="471" text-anchor="middle">No account</text>
      <rect x="1060" y="442" width="152" height="44" rx="22" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.26"/>
      <text x="1136" y="471" text-anchor="middle">Open source</text>
    </g>
  </g>
</svg>
