name: pastehive
description: "Keeps the clipboard in sync across your devices."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # SF-style icons, used on both platforms so the panel reads the same.
  cupertino_icons: ^1.0.8
  # Windows, tray icon, clipboard and display geometry through one native core.
  nativeapi: ^0.5.10
  nativeapi_flutter: ^0.5.10
  path: ^1.9.1
  path_provider: ^2.1.6
  cryptography: ^2.9.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Only for tool/generate_tray_icons.dart.
  image: ^4.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
