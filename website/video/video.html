<!doctype html>
<!--
  The PasteHive video, as a page.

  Nothing here plays by itself. Every movement is a function of one number,
  the time in seconds, set with window.seek(t). render.mjs steps that number
  one frame at a time, takes a picture of each frame and hands the pictures
  to ffmpeg. To look at it without rendering, open this file in a browser:
  it plays in real time, and ?t=21.5 opens it stopped at that second.

  Seven scenes, 48 seconds:
     0.0  the problem: copied on the computer, needed on the phone
     8.0  the problem: the clipboard remembers one thing
    13.0  PasteHive
    17.0  history: the panel at the top middle, search, paste
    26.5  sync: copy on one device, paste on another
    36.0  pairing: the six-digit code
    43.0  where to get it
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PasteHive video</title>
<script src="brand.js"></script>
<style>
@font-face { font-family: Geist; src: url(fonts/geist.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url(fonts/geist-mono.woff2) format("woff2"); font-weight: 100 900; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #060606; overflow: hidden; }
#stage {
  position: relative; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0;
  background: radial-gradient(ellipse 70% 60% at 50% 45%, #161616, #060606 75%);
  color: #fff; font-family: Geist, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
}
.scene { position: absolute; inset: 0; }
.abs { position: absolute; }
.cx { left: 50%; transform: translateX(-50%); }
.mono { font-family: "Geist Mono", Consolas, monospace; }
.dim { color: rgba(255,255,255,.66); }
svg.i { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.b { fill: currentColor; flex: none; }

/* Words */
.kicker { font: 500 22px "Geist Mono", monospace; letter-spacing: .24em; text-transform: uppercase; color: rgba(255,255,255,.55); white-space: nowrap; }
.h { font-weight: 600; letter-spacing: -.04em; line-height: 1.04; white-space: nowrap; }
.sub { font-size: 34px; line-height: 1.3; color: rgba(255,255,255,.7); letter-spacing: -.01em; }

/* Devices */
.lid { border-radius: 26px; border: 2px solid rgba(255,255,255,.22); background: #0b0b0b; padding: 14px; box-shadow: 0 50px 90px -40px #000, inset 0 1px 0 rgba(255,255,255,.14); }
.screen { position: relative; height: 100%; overflow: hidden; border-radius: 12px; background: linear-gradient(150deg, #3a3a3a, #151515 62%, #050505); }
.screen > .w1, .screen > .w2, .screen > .w3 { position: absolute; border-radius: 22%; }
.w1 { left: -8%; top: -30%; width: 46%; height: 110%; rotate: 12deg; background: rgba(255,255,255,.24); }
.w2 { right: -10%; top: 18%; width: 50%; height: 120%; rotate: -12deg; background: rgba(255,255,255,.13); }
.w3 { left: 34%; top: -40%; width: 30%; height: 70%; rotate: 45deg; background: rgba(255,255,255,.34); }
[data-os=mac] .w1 { left: auto; right: -6%; rotate: -12deg; } [data-os=mac] .w2 { right: auto; left: -12%; rotate: 12deg; } [data-os=mac] .w3 { rotate: -45deg; }
.base { position: relative; height: 20px; margin: 0 -24px; border-radius: 3px 3px 16px 16px; border: 2px solid rgba(255,255,255,.16); background: linear-gradient(#2a2a2a, #0d0d0d); }
.base::after { content: ""; position: absolute; left: 50%; top: 0; width: 110px; height: 5px; translate: -50% 0; border-radius: 0 0 9px 9px; background: rgba(0,0,0,.6); }
.bar { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.42); color: rgba(255,255,255,.88); z-index: 2; }
.taskbar { bottom: 0; height: 34px; justify-content: center; }
.taskbar span { width: 15px; height: 15px; border-radius: 4px; background: rgba(255,255,255,.26); }
.menubar { top: 0; height: 26px; padding: 0 14px; font-size: 12.5px; }
.phone { border-radius: 44px; border: 2px solid rgba(255,255,255,.22); background: #0b0b0b; padding: 9px; box-shadow: 0 50px 90px -36px #000, inset 0 1px 0 rgba(255,255,255,.14); }
.phone .screen { border-radius: 36px; background: linear-gradient(160deg, #1c1c1c, #0a0a0a); display: flex; flex-direction: column; }
.status { display: flex; justify-content: space-between; align-items: center; padding: 12px 24px 4px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,.85); }

/* An app window */
.win { position: absolute; display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; border: 1.5px solid rgba(255,255,255,.18); background: rgba(27,27,27,.96); box-shadow: 0 30px 50px -20px rgba(0,0,0,.85); }
.titlebar { display: flex; align-items: center; height: 2.3em; padding: 0 1em; border-bottom: 1px solid rgba(255,255,255,.09); font-size: .72em; color: rgba(255,255,255,.6); flex: none; }
.dots { display: flex; gap: .4em; } .dots i { width: .75em; height: .75em; border-radius: 50%; background: rgba(255,255,255,.3); }
.body { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; gap: .78em; padding: 1.1em 1.4em; }
.skel { height: .42em; border-radius: 9px; background: rgba(255,255,255,.16); } .skel.s { background: rgba(255,255,255,.3); }
.line { position: relative; width: fit-content; font-weight: 500; white-space: nowrap; }
.sel { position: absolute; inset: -.12em -.28em; border-radius: .22em; background: rgba(255,255,255,.3); transform-origin: left; }
.line em { position: relative; font-style: normal; }
.field { display: flex; align-items: center; gap: .5em; height: 2.7em; padding: 0 .85em; border-radius: .7em; border: 1.5px solid rgba(255,255,255,.16); background: rgba(0,0,0,.28); white-space: nowrap; }
.caret { width: 2px; height: 1.25em; border-radius: 2px; background: #fff; flex: none; }
.ph { color: rgba(255,255,255,.45); font-size: .88em; }
.copied { position: absolute; display: flex; align-items: center; gap: .45em; padding: .3em .7em .3em .3em; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.22); background: rgba(255,255,255,.15); font-size: .74em; font-weight: 500; white-space: nowrap; }
.copied b { padding: .1em .45em; border-radius: .4em; background: #fff; color: #000; font: 600 1em "Geist Mono", monospace; }

/* The clipboard panel and its rows. Sized in em, so one rule draws it at any size. */
.panel { position: absolute; display: flex; flex-direction: column; gap: .75em; padding: .9em; border-radius: 1.5em; border: 1.5px solid rgba(255,255,255,.17); background: rgba(20,20,26,.56); backdrop-filter: blur(22px); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.5), 0 30px 60px -18px rgba(0,0,0,.95); z-index: 4; }
.search { display: flex; align-items: center; gap: .65em; height: 3em; padding: 0 1em; border-radius: 99px; background: rgba(255,255,255,.11); color: rgba(255,255,255,.55); white-space: nowrap; }
.search .q { color: #fff; }
.chips { display: flex; gap: .35em; font-size: .86em; white-space: nowrap; overflow: hidden; }
.chips span { padding: .32em .8em; border-radius: 99px; color: rgba(255,255,255,.6); }
.chips span:first-child { background: rgba(255,255,255,.22); color: #fff; font-weight: 600; }
.rows { position: relative; }
.row { display: flex; align-items: center; gap: .9em; height: 4.2em; padding: 0 .6em; border-radius: .95em; }
.row.lit { background: rgba(255,255,255,.16); }
.tile { display: flex; align-items: center; justify-content: center; width: 2.9em; height: 2.9em; border-radius: .8em; overflow: hidden; background: rgba(255,255,255,.11); color: rgba(255,255,255,.88); flex: none; }
.tile svg.i { width: 1.5em; height: 1.5em; } .tile > svg:not(.i) { width: 100%; height: 100%; }
.rt { min-width: 0; line-height: 1.25; } .rt b { display: block; font-size: 1.14em; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rt span { display: block; font-size: .84em; color: rgba(255,255,255,.6); white-space: nowrap; }

.pointer { position: absolute; left: 0; top: 0; z-index: 6; }
.token { position: absolute; left: 0; top: 0; z-index: 9; }
.token > div { display: flex; align-items: center; gap: 10px; translate: -50% -50%; padding: 6px 20px 6px 6px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.2); background: rgba(40,40,46,.72); backdrop-filter: blur(14px); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 20px 40px -16px #000; font-size: 20px; font-weight: 500; white-space: nowrap; }
.token .tile { font-size: 13px; }
.echo { position: absolute; inset: -2px; border: 2px solid #fff; pointer-events: none; }
.label { position: absolute; display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 500; color: rgba(255,255,255,.88); translate: -50% 0; white-space: nowrap; }
.label span { font: 400 17px "Geist Mono", monospace; color: rgba(255,255,255,.55); }

/* Scene 1 */
.work { display: flex; gap: 18px; justify-content: center; left: 0; right: 0; top: 250px; }
.work > div { position: relative; display: flex; align-items: center; gap: 12px; padding: 13px 24px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); font-size: 25px; white-space: nowrap; }
.work > div > u { position: absolute; left: 14px; right: 14px; top: 50%; height: 3px; border-radius: 3px; background: #fff; transform-origin: left; }
.bubble { height: 46px; border-radius: 22px; background: rgba(255,255,255,.1); } .bubble.me { align-self: flex-end; background: rgba(255,255,255,.22); }
.pop { position: absolute; padding: 12px 22px; border-radius: 14px; background: #2c2c30; border: 1.5px solid rgba(255,255,255,.2); font-size: 19px; font-weight: 500; box-shadow: 0 16px 30px -10px #000; white-space: nowrap; }

/* Scene 2 */
.slot { border-radius: 34px; border: 2px dashed rgba(255,255,255,.3); background: rgba(255,255,255,.04); }
.big { position: absolute; left: 26px; right: 26px; top: 26px; height: 132px; font-size: 31px; background: rgba(40,40,46,.9); border: 1.5px solid rgba(255,255,255,.2); border-radius: 24px; box-shadow: inset 0 1.5px 0 rgba(255,255,255,.3), 0 26px 40px -18px #000; padding: 0 22px; }

/* Scene 3 and 7 */
.ring { position: absolute; left: 50%; border: 2px solid #fff; translate: -50% -50%; }
.logo { display: flex; align-items: center; justify-content: center; border-radius: 28%; border: 2px solid rgba(255,255,255,.3); background: linear-gradient(135deg, rgba(255,255,255,.3), rgba(255,255,255,.1) 50%, rgba(255,255,255,.04)); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 40px 70px -24px #000; }
.pill { display: inline-flex; align-items: center; gap: 12px; padding: 14px 28px; border-radius: 99px; border: 1.5px solid rgba(255,255,255,.2); background: rgba(255,255,255,.07); font-size: 26px; font-weight: 500; white-space: nowrap; }

/* Scene 6 */
.pane { position: absolute; display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 30px; border: 1.5px solid rgba(255,255,255,.16); background: rgba(20,20,26,.7); box-shadow: inset 0 1.5px 0 rgba(255,255,255,.35), 0 40px 70px -30px #000; font-size: 23px; }
.pane header { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 500; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-radius: 18px; background: rgba(255,255,255,.08); white-space: nowrap; }
.sw { position: relative; width: 62px; height: 36px; border-radius: 99px; border: 2px solid rgba(255,255,255,.3); background-color: rgba(255,255,255,.1); flex: none; }
.sw i { position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background-color: rgba(255,255,255,.75); }
.states { position: relative; flex: 1; }
.states > div { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.states p { color: rgba(255,255,255,.68); line-height: 1.35; }
.states small { font-size: 18px; font-weight: 600; color: rgba(255,255,255,.72); }
.item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px 14px 20px; border-radius: 16px; background: rgba(255,255,255,.08); white-space: nowrap; }
.btn { padding: 9px 22px; border-radius: 99px; background: #fff; color: #000; font-size: 20px; font-weight: 600; }
.code { display: flex; gap: 6px; font: 600 30px "Geist Mono", monospace; }
.code span { display: flex; align-items: center; justify-content: center; width: 44px; height: 58px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,.22); background: rgba(255,255,255,.1); }
.code span:nth-child(4) { margin-left: 14px; }
.tick { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; background: #fff; color: #000; flex: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ------------------------------------------------------------------ parts */

const PATHS = {
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  text: '<path d="M21 6H3M15 12H3M17 18H3"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  mail: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  message: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  keyboard: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  wifi: '<path d="M12 20h.01M2 8.82a15 15 0 0 1 20 0M5 12.86a10 10 0 0 1 14 0M8.5 16.43a5 5 0 0 1 7 0"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  cloudoff: '<path d="m2 2 20 20M5.78 5.78A7 7 0 0 0 9 19h8.5a4.5 4.5 0 0 0 1.31-.19M21.53 16.5A4.5 4.5 0 0 0 17.5 10h-1.79A7 7 0 0 0 10 5.07"/>',
  userx: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m17 8 5 5M22 8l-5 5"/>',
  down: '<path d="M12 17V3M6 11l6 6 6-6M19 21H5"/>',
};
const ico = (name, size = 24) => `<svg class="i" width="${size}" height="${size}" viewBox="0 0 24 24">${PATHS[name]}</svg>`;
const brand = (name, size = 24) => name === "windows"
  ? `<svg class="b" width="${size}" height="${size}" viewBox="0 0 24 24"><path d="M2 2h9.5v9.5H2zM12.5 2H22v9.5h-9.5zM2 12.5h9.5V22H2zM12.5 12.5H22V22h-9.5z"/></svg>`
  : `<svg class="b" width="${size}" height="${size}" viewBox="0 0 24 24"><path d="${BRAND[name]}"/></svg>`;
const mark = (size) => `<svg width="${size}" height="${size}" viewBox="192 192 640 640"><g fill="none" stroke="#fff" stroke-width="56" stroke-linecap="round"><path d="M322 482V382a90 90 0 0 1 90-90h200a90 90 0 0 1 90 90v46"/><path d="M702 582v100a90 90 0 0 1-90 90H412a90 90 0 0 1-90-90v-46"/></g><path d="M644 426h116l-58 84zM380 638H264l58-84z" fill="#fff"/><rect x="432" y="222" width="160" height="114" rx="38" fill="#fff"/><g fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round"><path d="M446 492h132M446 572h86"/></g></svg>`;

let unique = 0;
/* A stand-in photograph. The only colour in the film is copied content. */
const picture = () => { const id = "sky" + unique++; return `<svg viewBox="0 0 64 40" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5bdb"/><stop offset=".55" stop-color="#f783ac"/><stop offset="1" stop-color="#ffd8a8"/></linearGradient></defs><rect width="64" height="40" fill="url(#${id})"/><circle cx="44" cy="17" r="6" fill="#fff3bf"/><path d="M0 40V29l14-11 13 13 10-8 27 14v3z" fill="#1c2541"/><path d="M0 40v-6l20-7 20 9 24-5v9z" fill="#0b132b"/></svg>`; };
const tile = (kind) => kind === "image" ? `<div class="tile">${picture()}</div>`
  : kind === "color" ? `<div class="tile" style="background:#FF6B9D;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)"></div>`
  : `<div class="tile">${ico(kind === "email" ? "mail" : kind)}</div>`;

const ENTRY = {
  text: ["text", "Meeting moved to 3 pm, room 4B", "30 characters"],
  color: ["color", "#FF6B9D", "Color"],
  link: ["link", "https://flutter.dev/docs", "flutter.dev"],
  image: ["image", "Image", "1920 × 1080"],
  email: ["email", "sam@example.com", "Email"],
};
const row = (key, meta, extra = "") => { const [kind, title, plain] = ENTRY[key]; return `<div class="row ${extra}">${tile(kind)}<div class="rt"><b>${title}</b><span>${meta ?? plain}</span></div></div>`; };
const searchBar = (id) => `<div class="search">${ico("search", 20)}<span${id ? ` id="${id}"` : ""}>Search Clipboard</span></div>`;
const chips = (...names) => `<div class="chips">${names.map((n) => `<span>${n}</span>`).join("")}</div>`;
const pointer = (id) => `<div class="pointer" id="${id}"><svg width="30" height="38" viewBox="0 0 14 18"><path d="M1.5 1.5v12.7l3.4-3 2.4 5.2 2.3-1.1-2.4-5.1h4.7z" fill="#fff" stroke="#000" stroke-width="1.1" stroke-linejoin="round"/></svg></div>`;

function laptop({ id, x, y, w, h, os, inner }) {
  const bar = os === "mac"
    ? `<div class="bar menubar">${brand("apple", 14)}<b>Photos</b><span>File</span><span>Edit</span><span style="margin-left:auto;display:flex;gap:10px">${mark(16)}${ico("wifi", 15)}</span></div>`
    : `<div class="bar taskbar">${brand("windows", 16)}<span></span><span></span><span></span><div style="position:absolute;right:16px;display:flex;gap:10px">${mark(16)}${ico("wifi", 15)}</div></div>`;
  return `<div class="abs" id="${id}" style="left:${x}px;top:${y}px;width:${w}px"><div class="lid" style="height:${h}px"><div class="screen" data-os="${os}"><i class="w1"></i><i class="w2"></i><i class="w3"></i>${bar}${inner}</div></div><div class="base"></div></div>`;
}
const phone = ({ id, x, y, w, h, inner }) => `<div class="abs phone" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><div class="screen"><div class="status"><span>10:24</span><span style="display:flex;gap:6px">${ico("wifi", 14)}</span></div>${inner}</div></div>`;
const note = (id, size) => `<div class="titlebar"><span>Notes</span></div><div class="body"><i class="skel s" style="width:46%"></i><i class="skel" style="width:88%"></i><span class="line"><i class="sel" id="${id}"></i><em>Meeting moved to 3 pm, room 4B</em></span><i class="skel" style="width:70%"></i>`;

/* ------------------------------------------------------------------ scenes */

const stage = document.getElementById("stage");
stage.innerHTML = `
<!-- 1. Copied here, needed there -->
<div class="scene" id="s1">
  <div class="abs cx kicker" style="top:84px">The problem</div>
  <div class="abs cx h" id="c1a" style="top:132px;font-size:68px">You copy something on your computer.</div>
  <div class="abs cx h" id="c1b" style="top:132px;font-size:68px">You need it on your phone.</div>
  <div class="abs cx h" id="c1c" style="top:132px;font-size:68px">So you send it to yourself. Again.</div>
  <div class="abs work">
    <div id="w1">${ico("mail", 26)}Email it to yourself<u></u></div>
    <div id="w2">${ico("message", 26)}Message it to yourself<u></u></div>
    <div id="w3">${ico("keyboard", 26)}Type it out again<u></u></div>
  </div>
  ${laptop({ id: "l1", x: 170, y: 356, w: 840, h: 520, os: "win", inner: `
    <div class="win" style="left:70px;top:56px;width:650px;height:340px;font-size:29px">${note("sel1")}
      <div class="copied" id="chip1" style="right:22px;top:20px"><b>Ctrl+C</b>Copied</div></div></div>
    ${pointer("p1")}` })}
  ${phone({ id: "ph1", x: 1330, y: 320, w: 330, h: 670, inner: `
    <div style="padding:8px 22px 14px;font-size:22px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.1)">Sam</div>
    <div style="flex:1;display:flex;flex-direction:column;gap:14px;padding:22px 18px">
      <i class="bubble" style="width:70%"></i><i class="bubble me" style="width:54%"></i><i class="bubble" style="width:62%"></i>
    </div>
    <div style="position:relative;padding:14px 16px 26px">
      <div class="field" style="font-size:19px;border-radius:99px"><i class="caret" id="caret1"></i><span class="ph">Message</span></div>
      <div class="pop" id="paste1" style="left:26px;bottom:92px">Paste</div>
      <div class="pop" id="empty1" style="left:26px;bottom:92px">Nothing to paste</div>
      <div class="abs" id="tap1" style="left:70px;bottom:34px;width:44px;height:44px;border-radius:50%;border:2.5px solid #fff"></div>
    </div>` })}
</div>

<!-- 2. One thing at a time -->
<div class="scene" id="s2">
  <div class="abs cx kicker" style="top:84px">The problem</div>
  <div class="abs cx h" style="top:132px;font-size:68px">And your clipboard remembers only one thing.</div>
  <div class="abs cx kicker" style="top:398px;font-size:20px">Clipboard</div>
  <div class="abs slot" style="left:440px;top:444px;width:1040px;height:188px">

/* ------------------------------------------------------------------- clock */

window.DURATION = DURATION;
window.seek = (seconds) => {
  const t = Math.max(0, Math.min(DURATION - 0.001, seconds));
  for (const animation of animations) animation.currentTime = t * 1000;
  for (const hook of hooks) hook(t);
};
window.ready = document.fonts.ready.then(() => { window.seek(0); });

// Opened by hand: fit the window, and play, or stop at ?t=.
if (!navigator.webdriver) {
  const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
  addEventListener("resize", fit); fit();
  const fixed = new URLSearchParams(location.search).get("t");
  if (fixed != null) window.ready.then(() => window.seek(+fixed));
  else { const began = performance.now(); const tick = (now) => { window.seek(((now - began) / 1000) % DURATION); requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
}
